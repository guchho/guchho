name: Publish to WinGet

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Guchho.Guchho
          installers-regex: 'win32-x64\.zip$'
          fork-user: hemanta-gayen
          token: ${{ secrets.WINGET_TOKEN }}
