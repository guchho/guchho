name: npm-publish

# Manual-only. No push, pull_request, release, workflow_run, schedule or
# tag-based trigger: pushing a tag or cutting a GitHub Release must never
# start this workflow. The only supported entry points are
# `gh workflow run npm-publish.yml` and the Actions UI "Run workflow".
on:
  workflow_dispatch:
    inputs:
      type:
        description: "What to publish"
        required: true
        default: "all"
        type: choice
        options:
          - linux-x64
          - win32-x64
          - darwin-arm64
          - all

      dry_run:
        description: "Build and package without publishing to npm"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  # ============================================
  # Job 0: Resolve the requested platform set
  # ============================================
  #
  # A job-level `if:` cannot see the matrix context, and gating steps inside
  # a fully expanded matrix still starts (and pays for) a runner per skipped
  # platform. So the selection is resolved here into a JSON matrix that the
  # build job consumes, and only the requested platforms ever get a runner.
  plan:
    runs-on: ubuntu-latest
    name: plan
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      platforms: ${{ steps.select.outputs.platforms }}
      type: ${{ steps.select.outputs.type }}
      version: ${{ steps.select.outputs.version }}
      dry_run: ${{ steps.select.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve platform set
        id: select
        shell: bash
        env:
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          TYPE="${INPUT_TYPE:-}"
          # Publish only when dry_run is explicitly false. A missing or
          # unrecognized value resolves to true, so an absent input can
          # never be read as permission to publish.
          case "${INPUT_DRY_RUN:-}" in
            false) DRY_RUN="false" ;;
            *)     DRY_RUN="true" ;;
          esac

          case "$TYPE" in
            linux-x64|win32-x64|darwin-arm64)
              PLATFORMS="$TYPE"
              ;;
            all)
              PLATFORMS="linux-x64 win32-x64 darwin-arm64"
              ;;
            *)
              echo "::error::Unsupported type: '$TYPE'"
              exit 1
              ;;
          esac

          # The three supported publish targets, mirroring the build matrix
          # below. Only entries in this list can ever be selected.
          MATRIX='[
            {"platform":"linux-x64","runner":"ubuntu-latest","method":"native","preset":"release-linux-x64"},
            {"platform":"darwin-arm64","runner":"macos-latest","method":"native","preset":"release-darwin-arm64"},
            {"platform":"win32-x64","runner":"windows-latest","method":"native","preset":"release-win32-x64-ninja"}
          ]'

          SELECTED="$(
            echo "$MATRIX" | node -e '
              const all = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const want = process.argv.slice(1);
              const out = all.filter((e) => want.includes(e.platform));
              if (out.length !== want.length) {
                console.error("matrix is missing a requested platform");
                process.exit(1);
              }
              process.stdout.write(JSON.stringify(out));
            ' $PLATFORMS
          )"

          VERSION="$(node -p "require('./package/npm/guchho/package.json').version")"

          echo "Type:    ${TYPE}"
          echo "Mode:    $([ "$DRY_RUN" = "true" ] && echo 'DRY RUN' || echo 'PUBLISH')"
          echo "Platform set: ${PLATFORMS}"
          echo "Version: ${VERSION}"

          echo "matrix=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Job 1: Build binaries for selected platforms
  # ============================================
  build:
    needs: plan
    strategy:
      fail-fast: false
      # Resolved by the plan job: only the platforms requested through the
      # `type` input appear here, so unselected platforms never start a
      # runner. The entries themselves (runner, method, preset) are defined
      # in the plan job's MATRIX below.
      #
      # To add a platform: add it to MATRIX in the plan job, to the `type`
      # input options, and (for a publish target) to package/npm/@guchho/.
      #
      # ---- Native builds (optional) ----
      # - platform: linux-arm64
      #   runner: ubuntu-24.04-arm
      #   method: native
      #   preset: release-linux-arm64
      #
      # - platform: darwin-x64
      #   runner: macos-15-intel
      #   method: native
      #   preset: release-darwin-x64
      #
      # ---- GCC cross-compilers ----
      # - platform: linux-arm
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: arm-linux-gnueabihf-gcc
      #   cxx: arm-linux-gnueabihf-g++
      #   cross_packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      #
      # - platform: linux-ia32
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: gcc
      #   cxx: g++
      #   cross_packages: gcc-multilib g++-multilib
      #   cmake_flags: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
      #
      # - platform: linux-s390x
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: s390x-linux-gnu-gcc
      #   cxx: s390x-linux-gnu-g++
      #   cross_packages: gcc-s390x-linux-gnu g++-s390x-linux-gnu
      #
      # - platform: linux-ppc64
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: powerpc64le-linux-gnu-gcc
      #   cxx: powerpc64le-linux-gnu-g++
      #   cross_packages: gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu
      #
      # - platform: linux-riscv64
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: riscv64-linux-gnu-gcc
      #   cxx: riscv64-linux-gnu-g++
      #   cross_packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
      #
      # - platform: linux-mips64el
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: mips64el-linux-gnuabi64-gcc
      #   cxx: mips64el-linux-gnuabi64-g++
      #   cross_packages: gcc-mips64el-linux-gnuabi64 g++-mips64el-linux-gnuabi64
      #
      # ---- Docker (only where no cross-compiler exists) ----
      # - platform: linux-loong64
      #   runner: ubuntu-latest
      #   method: docker
      #   docker_image: ghcr.io/loong64/loongnix:25
      #
      # ---- Windows MSVC cross-compilation ----
      # - platform: win32-ia32
      #   runner: windows-latest
      #   method: msvc_cross
      #   arch: Win32
      #
      # - platform: win32-arm64
      #   runner: windows-latest
      #   method: msvc_cross
      #   arch: ARM64
      #
      # ---- Android NDK cross-compilation ----
      # - platform: android-arm
      #   runner: ubuntu-latest
      #   method: android
      #   android_abi: armeabi-v7a
      #   android_api: 21
      #
      # - platform: android-arm64
      #   runner: ubuntu-latest
      #   method: android
      #   android_abi: arm64-v8a
      #   android_api: 21
      #
      # - platform: android-x64
      #   runner: ubuntu-latest
      #   method: android
      #   android_abi: x86_64
      #   android_api: 21
      # The plan job emits the entries as a JSON array; strategy.matrix takes
      # that array through `include`, which is the mapping form it evaluates
      # to (a bare array at this level is rejected as "A sequence was not
      # expected"). With include as the only key, each entry becomes one job.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================
      # Native builds (Linux, macOS, Windows)
      # ============================================
      - name: Setup CMake (native)
        if: matrix.method == 'native'
        uses: lukka/get-cmake@latest

      - name: Setup Ninja (native)
        if: matrix.method == 'native'
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build || true
          fi
        shell: bash

      - name: Build (native)
        if: matrix.method == 'native'
        run: |
          cmake --preset ${{ matrix.preset }} --fresh
          cmake --build --preset ${{ matrix.preset }} --parallel
        shell: bash

      - name: Find binary (native)
        if: matrix.method == 'native'
        id: find_binary
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          PRESET="${{ matrix.preset }}"

          if [[ "$PLATFORM" == win32-* ]]; then
            BINARY_NAME="guchho.exe"
          else
            BINARY_NAME="guchho"
          fi

          SEARCH_PATHS=(
            "build/${PRESET}/bin/${BINARY_NAME}"
            "build/${PRESET}/bin/Release/${BINARY_NAME}"
            "build/${PRESET}/${BINARY_NAME}"
          )

          FOUND=""
          for p in "${SEARCH_PATHS[@]}"; do
            if [[ -f "$p" ]]; then
              FOUND="$p"
              break
            fi
          done

          if [[ -z "$FOUND" ]]; then
            echo "::error::Could not find binary for ${PLATFORM}"
            echo "Searched:"
            for p in "${SEARCH_PATHS[@]}"; do echo "  $p"; done
            exit 1
          fi

          echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "Found: ${FOUND}"

      # ============================================
      # GCC cross-compilation
      # ============================================
      - name: Install cross-compiler
        if: matrix.method == 'cross'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Build (GCC cross-compile)
        if: matrix.method == 'cross'
        run: |
          cmake -B build/release-${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_C_EXTENSIONS=OFF \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_TESTING=OFF \
            ${{ matrix.cmake_flags || '' }}
          cmake --build build/release-${{ matrix.platform }} --parallel
        shell: bash

      - name: Find binary (cross)
        if: matrix.method == 'cross'
        id: find_binary_cross
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BINARY_NAME="guchho"
          FOUND="build/release-${PLATFORM}/bin/${BINARY_NAME}"

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::warning::Could not find binary for ${PLATFORM}"
            echo "binary_path=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================
      # Linux Docker cross-compilation (loong64 only)
      # ============================================
      - name: Setup QEMU (Docker)
        if: matrix.method == 'docker'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/loong64

      - name: Build (Docker cross-compile)
        if: matrix.method == 'docker'
        run: |
          docker run --rm --platform linux/loong64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ matrix.docker_image }} \
            bash -c "
              apt-get -o Acquire::https::Verify-Peer=false update && apt-get -o Acquire::https::Verify-Peer=false install -y cmake ninja-build g++ pkg-config &&
              cmake -B build/release-${{ matrix.platform }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_STANDARD=17 \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_C_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_C_EXTENSIONS=OFF \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DBUILD_TESTING=OFF &&
              cmake --build build/release-${{ matrix.platform }} --parallel
            "
        shell: bash

      - name: Find binary (Docker)
        if: matrix.method == 'docker'
        id: find_binary_docker
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          PRESET="release-${PLATFORM}"
          BINARY_NAME="guchho"

          SEARCH_PATHS=(
            "build/${PRESET}/bin/${BINARY_NAME}"
            "build/${PRESET}/${BINARY_NAME}"
          )

          FOUND=""
          for p in "${SEARCH_PATHS[@]}"; do
            if [[ -f "$p" ]]; then
              FOUND="$p"
              break
            fi
          done

          if [[ -z "$FOUND" ]]; then
            echo "::warning::Could not find binary for ${PLATFORM} (cross-compile may not produce output in expected location)"
            mkdir -p "package/npm/@guchho/${PLATFORM}/bin"
            echo "binary_path=package/npm/@guchho/${PLATFORM}/bin/${BINARY_NAME}" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          fi

      # ============================================
      # Windows MSVC cross-compilation
      # ============================================
      - name: Build (MSVC cross)
        if: matrix.method == 'msvc_cross'
        run: |
          cmake -B build/release-${{ matrix.platform }} \
            -G "Visual Studio 18 2026" \
            -A ${{ matrix.arch }} \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          cmake --build build/release-${{ matrix.platform }} --config Release --parallel
        shell: bash

      - name: Find binary (MSVC cross)
        if: matrix.method == 'msvc_cross'
        id: find_binary_msvc
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BINARY_NAME="guchho.exe"
          FOUND="build/release-${PLATFORM}/bin/Release/${BINARY_NAME}"

          if [[ ! -f "$FOUND" ]]; then
            FOUND="build/release-${PLATFORM}/bin/${BINARY_NAME}"
          fi

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::warning::Could not find binary for ${PLATFORM}"
            echo "binary_path=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================
      # Android NDK cross-compilation
      # ============================================
      - name: Setup Android NDK
        if: matrix.method == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build (Android NDK)
        if: matrix.method == 'android'
        run: |
          cmake -B build/release-${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.android_api }} \
            -DANDROID_STL=c++_shared \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          cmake --build build/release-${{ matrix.platform }} --parallel
        shell: bash

      - name: Find binary (Android)
        if: matrix.method == 'android'
        id: find_binary_android
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BINARY_NAME="guchho"
          FOUND="build/release-${PLATFORM}/bin/${BINARY_NAME}"

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::warning::Could not find binary for ${PLATFORM}"
            echo "binary_path=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================
      # Copy binary to package directory
      # ============================================
      - name: Prepare package directory
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          PKG_DIR="package/npm/@guchho/${PLATFORM}"
          mkdir -p "${PKG_DIR}/bin"

          # Determine binary name
          if [[ "$PLATFORM" == win32-* ]]; then
            BINARY_NAME="guchho.exe"
          else
            BINARY_NAME="guchho"
          fi

          # Find the binary from the appropriate step
          BINARY_PATH=""
          for step_output in \
            "${{ steps.find_binary.outputs.binary_path }}" \
            "${{ steps.find_binary_cross.outputs.binary_path }}" \
            "${{ steps.find_binary_docker.outputs.binary_path }}" \
            "${{ steps.find_binary_msvc.outputs.binary_path }}" \
            "${{ steps.find_binary_android.outputs.binary_path }}"; do
            if [[ -n "$step_output" && -f "$step_output" ]]; then
              BINARY_PATH="$step_output"
              break
            fi
          done

          if [[ -n "$BINARY_PATH" && -f "$BINARY_PATH" ]]; then
            cp "$BINARY_PATH" "${PKG_DIR}/bin/${BINARY_NAME}"

            # Strip debug symbols on Unix
            if [[ "$PLATFORM" != win32-* ]]; then
              chmod +x "${PKG_DIR}/bin/${BINARY_NAME}"
              strip "${PKG_DIR}/bin/${BINARY_NAME}" 2>/dev/null || true
            fi

            echo "Copied binary to ${PKG_DIR}/bin/${BINARY_NAME}"
            ls -lh "${PKG_DIR}/bin/${BINARY_NAME}"
          else
            # A platform package without a binary is not publishable, and an
            # empty one would install and fail at runtime. Fail here, before
            # anything is uploaded or published.
            echo "::error::No binary found for ${PLATFORM} — refusing to package an empty package"
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform }}
          path: package/npm/@guchho/${{ matrix.platform }}/
          retention-days: 1

  # ============================================
  # Job 2: Validate artifacts, versions and packages
  # ============================================
  #
  # Everything that can be checked before publishing is checked here, so a
  # bad artifact or a version mismatch fails the workflow while nothing has
  # been published yet. This job never publishes anything.
  validate:
    needs: [plan, build]
    runs-on: ubuntu-latest
    name: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: package-*

      - name: Sync artifacts to package directory
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          synced=0
          for dir in artifacts/*/; do
            NAME=$(basename "$dir")
            case "$NAME" in
              package-*)
                PLATFORM="${NAME#package-}"
                DEST="package/npm/@guchho/${PLATFORM}"
                mkdir -p "${DEST}"
                cp -r "${dir}"* "${DEST}/"
                echo "Synced: ${PLATFORM}"
                synced=1
                ;;
            esac
          done
          # download-artifact extracts a single pattern-matched artifact
          # directly into the path instead of a package-<platform>/
          # directory, so fall back to the resolved platform set.
          if [[ "$synced" -eq 0 ]]; then
            for PLATFORM in ${PUBLISH_PLATFORMS}; do
              DEST="package/npm/@guchho/${PLATFORM}"
              mkdir -p "${DEST}"
              cp -r artifacts/* "${DEST}/"
              echo "Synced: ${PLATFORM}"
            done
          fi

      # Versions are compared, never rewritten. The expected version comes
      # from the main package manifest; for a platform run only the selected
      # package is checked, for `all` every package involved is checked along
      # with the optionalDependencies pins that tie the main package to them.
      - name: Validate package versions
        shell: bash
        env:
          PUBLISH_TYPE: ${{ needs.plan.outputs.type }}
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PUBLISH_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const type = process.env.PUBLISH_TYPE;
          const platforms = (process.env.PUBLISH_PLATFORMS || "").split(/\s+/).filter(Boolean);
          const expected = process.env.PUBLISH_VERSION;
          const SEMVER = /^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/;

          let failures = 0;
          const fail = (msg) => {
            console.log(`::error::${msg}`);
            failures++;
          };

          const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));

          if (!expected || !SEMVER.test(expected)) {
            fail(`expected version '${expected}' is not valid semver`);
          }

          const main = read("package/npm/guchho/package.json");
          if (main.name !== "guchho") {
            fail(`main package is named '${main.name}', expected 'guchho'`);
          }
          if (main.version !== expected) {
            fail(`package/npm/guchho/package.json says ${main.version}, expected ${expected}`);
          }

          for (const p of platforms) {
            const manifest = `package/npm/@guchho/${p}/package.json`;
            if (!fs.existsSync(manifest)) {
              fail(`missing ${manifest}`);
              continue;
            }
            const pkg = read(manifest);
            if (pkg.name !== `@guchho/${p}`) {
              fail(`${manifest} is named '${pkg.name}', expected '@guchho/${p}'`);
            }
            if (typeof pkg.version !== "string" || !SEMVER.test(pkg.version)) {
              fail(`${manifest} version '${pkg.version}' is not valid semver`);
            } else if (pkg.version !== expected) {
              fail(`${manifest} is ${pkg.version}, expected ${expected} (main package version)`);
            }
          }

          if (type === "all") {
            const pins = main.optionalDependencies || {};
            for (const p of platforms) {
              const pin = pins[`@guchho/${p}`];
              if (pin !== expected) {
                fail(`optionalDependencies pin for @guchho/${p} is '${pin}', expected '${expected}'`);
              }
            }
          }

          if (failures > 0) {
            console.log(`::error::Version validation failed (${failures} problem(s)) -- not publishing`);
            process.exit(1);
          }
          console.log(`All selected packages agree on version ${expected}`);
          EOF

      # The last gate before anything can be published: the expected binary
      # is present in the assembled package, and npm can pack it. A dry run
      # stops at this point with a full listing of what a publish would
      # upload.
      - name: Validate package contents
        shell: bash
        env:
          PUBLISH_TYPE: ${{ needs.plan.outputs.type }}
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PKG="package/npm/@guchho/${PLATFORM}"

            if [[ "$PLATFORM" == win32-* ]]; then
              BINARY="${PKG}/bin/guchho.exe"
            else
              BINARY="${PKG}/bin/guchho"
            fi

            echo "========================================"
            echo "Validating @guchho/${PLATFORM}"
            echo "========================================"

            if [[ ! -f "${PKG}/package.json" ]]; then
              echo "::error::${PKG}/package.json is missing"
              exit 1
            fi

            if [[ ! -f "${BINARY}" ]]; then
              echo "::error::expected binary ${BINARY} is missing from the package"
              exit 1
            fi

            if [[ ! -s "${BINARY}" ]]; then
              echo "::error::binary ${BINARY} is empty"
              exit 1
            fi

            echo "npm pack --dry-run for @guchho/${PLATFORM}:"
            npm pack "${PKG}" --dry-run 2>&1
            echo ""
          done

  # ============================================
  # Job 3: Publish platform packages
  # ============================================
  publish-platforms:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    name: publish-platforms
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: package-*

      - name: Sync artifacts to package directory
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          synced=0
          for dir in artifacts/*/; do
            NAME=$(basename "$dir")
            case "$NAME" in
              package-*)
                PLATFORM="${NAME#package-}"
                DEST="package/npm/@guchho/${PLATFORM}"
                mkdir -p "${DEST}"
                cp -r "${dir}"* "${DEST}/"
                echo "Synced: ${PLATFORM}"
                synced=1
                ;;
            esac
          done
          # download-artifact extracts a single pattern-matched artifact
          # directly into the path instead of a package-<platform>/
          # directory, so fall back to the resolved platform set.
          if [[ "$synced" -eq 0 ]]; then
            for PLATFORM in ${PUBLISH_PLATFORMS}; do
              DEST="package/npm/@guchho/${PLATFORM}"
              mkdir -p "${DEST}"
              cp -r artifacts/* "${DEST}/"
              echo "Synced: ${PLATFORM}"
            done
          fi

      # Dry run: show exactly what a publish would upload, and never call
      # npm publish. The publish step below is the only place in this
      # workflow that can publish, and it is gated on an explicit
      # dry_run=false.
      - name: "Dry run: pack selected packages"
        if: needs.plan.outputs.dry_run != 'false'
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PKG="package/npm/@guchho/${PLATFORM}"
            NAME=$(node -p "require('./${PKG}/package.json').name")
            VERSION=$(node -p "require('./${PKG}/package.json').version")

            if [[ "$PLATFORM" == win32-* ]]; then
              BINARY="${PKG}/bin/guchho.exe"
            else
              BINARY="${PKG}/bin/guchho"
            fi

            if [[ ! -f "${BINARY}" ]]; then
              echo "::error::expected binary ${BINARY} is missing"
              exit 1
            fi

            echo "========================================"
            echo "[DRY RUN] Would publish ${NAME}@${VERSION}"
            echo "========================================"
            npm pack "${PKG}" --dry-run 2>&1
            echo ""
          done

          echo "No packages were published."

      - name: Publish platform packages
        if: needs.plan.outputs.dry_run == 'false'
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PKG="package/npm/@guchho/${PLATFORM}"
            NAME=$(node -p "require('./${PKG}/package.json').name")
            VERSION=$(node -p "require('./${PKG}/package.json').version")

            if [[ "$PLATFORM" == win32-* ]]; then
              BINARY="${PKG}/bin/guchho.exe"
            else
              BINARY="${PKG}/bin/guchho"
            fi

            if [[ ! -f "${BINARY}" ]]; then
              echo "::error::expected binary ${BINARY} is missing -- not publishing"
              exit 1
            fi

            echo "========================================"
            echo "Publishing: ${NAME}@${VERSION}"
            echo "========================================"

            # A failed publish fails the workflow: swallowing it would let
            # the main package publish on top of an incomplete set.
            if ! npm publish "${PKG}" --access public --provenance 2>&1; then
              echo "::error::Failed to publish ${NAME}@${VERSION}"
              exit 1
            fi

            echo ""
          done

  # ============================================
  # Job 4: Publish main package (last, type=all only)
  # ============================================
  #
  # Gated on the platform packages having succeeded: a failure anywhere
  # upstream leaves result != 'success' and this job is skipped, so a
  # partial platform set can never be topped with a main package.
  publish-main:
    needs: [plan, publish-platforms]
    if: ${{ needs.plan.outputs.type == 'all' && needs.publish-platforms.result == 'success' }}
    runs-on: ubuntu-latest
    name: publish-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Validate main package
        shell: bash
        env:
          PUBLISH_TYPE: ${{ needs.plan.outputs.type }}
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PUBLISH_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package/npm/guchho/package.json').name")
          VERSION=$(node -p "require('./package/npm/guchho/package.json').version")

          if [[ "$NAME" != "guchho" ]]; then
            echo "::error::main package is named '${NAME}', expected 'guchho'"
            exit 1
          fi

          if [[ "$VERSION" != "$PUBLISH_VERSION" ]]; then
            echo "::error::main package is ${VERSION}, expected ${PUBLISH_VERSION}"
            exit 1
          fi

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PIN=$(node -p "require('./package/npm/guchho/package.json').optionalDependencies['@guchho/${PLATFORM}']")
            if [[ "$PIN" != "$PUBLISH_VERSION" ]]; then
              echo "::error::optionalDependencies pin for @guchho/${PLATFORM} is '${PIN}', expected '${PUBLISH_VERSION}'"
              exit 1
            fi
          done

          echo "Validated guchho@${VERSION}"
          echo "npm pack --dry-run for guchho:"
          npm pack package/npm/guchho --dry-run 2>&1

      - name: "Dry run: pack main package"
        if: needs.plan.outputs.dry_run != 'false'
        shell: bash
        run: |
          NAME=$(node -p "require('./package/npm/guchho/package.json').name")
          VERSION=$(node -p "require('./package/npm/guchho/package.json').version")
          echo "[DRY RUN] Would publish ${NAME}@${VERSION}"
          echo "No packages were published."

      - name: Publish main package
        if: needs.plan.outputs.dry_run == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package/npm/guchho/package.json').name")
          VERSION=$(node -p "require('./package/npm/guchho/package.json').version")

          echo "========================================"
          echo "Publishing: ${NAME}@${VERSION}"
          echo "========================================"

          if ! npm publish package/npm/guchho --access public --provenance 2>&1; then
            echo "::error::Failed to publish ${NAME}@${VERSION}"
            exit 1
          fi

  # ============================================
  # Summary
  # ============================================
  summary:
    needs: [plan, build, validate, publish-platforms, publish-main]
    runs-on: ubuntu-latest
    if: always()
    name: summary
    steps:
      - name: Write job summary
        shell: bash
        env:
          TYPE: ${{ needs.plan.outputs.type }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_PLATFORMS_RESULT: ${{ needs.publish-platforms.result }}
          PUBLISH_MAIN_RESULT: ${{ needs.publish-main.result }}
        run: |
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          {
            echo "Guchho npm publish"
            echo ""
            echo "Type: ${TYPE:-unknown}"

            if [[ "$PLAN_RESULT" != "success" ]]; then
              echo "Mode: FAILED"
              echo ""
              echo "The workflow failed before the platform set could be resolved."
              exit 0
            fi

            if [[ "$DRY_RUN" == "false" ]]; then
              MODE="PUBLISHED"
            else
              MODE="DRY RUN"
            fi
            echo "Mode: ${MODE}"
            echo ""

            # A package gets a tick only when every job that had to succeed
            # for it did: build + validate + its publish job.
            build_ok()  { [[ "$BUILD_RESULT" == "success" ]]; }
            val_ok()    { [[ "$VALIDATE_RESULT" == "success" ]]; }
            plat_ok()   { [[ "$PUBLISH_PLATFORMS_RESULT" == "success" ]]; }
            main_ok()   { [[ "$PUBLISH_MAIN_RESULT" == "success" ]]; }

            echo "Packages:"

            failed=0
            for platform in ${PLATFORMS}; do
              if build_ok && val_ok && plat_ok; then
                echo "- ✓ @guchho/${platform}@${VERSION}"
              else
                echo "- ✗ @guchho/${platform}@${VERSION}"
                failed=1
              fi
            done

            if [[ "$TYPE" == "all" ]]; then
              if build_ok && val_ok && plat_ok && main_ok; then
                echo "- ✓ guchho@${VERSION}"
              else
                echo "- ✗ guchho@${VERSION}"
                failed=1
              fi
            fi

            echo ""

            if [[ "$failed" -ne 0 ]]; then
              if [[ "$DRY_RUN" == "false" ]]; then
                echo "**The workflow failed. Publishing stopped -- check the failing job's logs before re-running.**"
              else
                echo "**The workflow failed. No packages were published.**"
              fi
            elif [[ "$DRY_RUN" == "false" ]]; then
              echo "All selected packages were published to npm."
              echo ""
              echo "View on npm: https://www.npmjs.com/package/guchho"
            else
              echo "No packages were published."
            fi
          } | tee -a "$SUMMARY_FILE"
