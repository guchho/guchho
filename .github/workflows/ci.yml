name: Node.js CI

on:
  # Only when a version is released: a v* tag (v1.0.9, ...). Pushes to main
  # and pull requests deliberately do not run this workflow.
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: npm smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install published guchho
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guchho-test"
          cd "$RUNNER_TEMP/guchho-test"
          npm init -y
          # npm init writes "type": "commonjs", but guchho.config.js is ESM.
          npm pkg set type=module
          npm install --no-audit --no-fund guchho@latest

      - name: CLI responds
        run: |
          cd "$RUNNER_TEMP/guchho-test"
          npx --no-install guchho --version
          npx --no-install guchho --help

      - name: Scaffold and build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/guchho-test"
          # The directory already holds package.json and node_modules from the
          # install above, so init must be told to scaffold into it anyway.
          npx --no-install guchho init --force -y
          npx --no-install guchho build
          if [ ! -f dist/index.html ]; then
            echo "::error::guchho build did not produce dist/index.html"
            find . -maxdepth 4 -type f -print
            exit 1
          fi
          echo "npm smoke test passed"
