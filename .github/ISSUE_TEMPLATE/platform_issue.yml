name: Platform Issue
description: Report an issue with a specific platform package
title: "[Platform]: "
labels: ["platform"]
body:
  - type: markdown
    attributes:
      value: |
        Report issues with a specific `@guchho/*` platform package.

  - type: dropdown
    id: platform-package
    attributes:
      label: Platform Package
      description: Which platform package is affected?
      options:
        - "@guchho/aix-ppc64"
        - "@guchho/android-arm"
        - "@guchho/android-arm64"
        - "@guchho/android-x64"
        - "@guchho/darwin-arm64"
        - "@guchho/darwin-x64"
        - "@guchho/freebsd-arm64"
        - "@guchho/freebsd-x64"
        - "@guchho/linux-arm"
        - "@guchho/linux-arm64"
        - "@guchho/linux-ia32"
        - "@guchho/linux-loong64"
        - "@guchho/linux-mips64el"
        - "@guchho/linux-ppc64"
        - "@guchho/linux-riscv64"
        - "@guchho/linux-s390x"
        - "@guchho/linux-x64"
        - "@guchho/netbsd-arm64"
        - "@guchho/netbsd-x64"
        - "@guchho/openbsd-arm64"
        - "@guchho/openbsd-x64"
        - "@guchho/openharmony-arm64"
        - "@guchho/sunos-x64"
        - "@guchho/win32-arm64"
        - "@guchho/win32-ia32"
        - "@guchho/win32-x64"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: "Output of `npm ls @guchho/<platform>`"
      placeholder: "1.2.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the issue
      placeholder: The binary for this platform...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. `npm install guchho`
        2. Run on <platform>...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The binary should...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Instead, this happened...
    validations:
      required: true

  - type: input
    id: os-arch
    attributes:
      label: OS and Architecture
      description: "Output of `uname -a` or system info"
      placeholder: "Linux 6.1.0 x86_64"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any additional context, logs, or screenshots
      placeholder: Paste any relevant output here...
    validations:
      required: false
