name: npm-publish

# Manual-only. No push, pull_request, release, workflow_run, schedule or
# tag-based trigger: pushing a tag or cutting a GitHub Release must never
# start this workflow. The only supported entry points are
# `gh workflow run npm-publish.yml` and the Actions UI "Run workflow".
on:
  workflow_dispatch:
    inputs:
      type:
        description: "What to publish"
        required: true
        default: "all"
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - linux-s390x
          - linux-ppc64
          - win32-x64
          - win32-arm64
          - win32-ia32
          - darwin-arm64
          - darwin-x64
          - android-x64
          - android-arm64
          - freebsd-x64
          - wasm
          - guchho
          - all

      dry_run:
        description: "Build and package without publishing to npm"
        required: false
        default: true
        type: boolean

      test_run:
        description: "Run the automated test suite after each native build"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "20"

jobs:
  # ============================================
  # Job 0: Resolve the requested platform set
  # ============================================
  #
  # A job-level `if:` cannot see the matrix context, and gating steps inside
  # a fully expanded matrix still starts (and pays for) a runner per skipped
  # platform. So the selection is resolved here into a JSON matrix that the
  # build job consumes, and only the requested platforms ever get a runner.
  plan:
    runs-on: ubuntu-latest
    name: plan
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      platforms: ${{ steps.select.outputs.platforms }}
      type: ${{ steps.select.outputs.type }}
      version: ${{ steps.select.outputs.version }}
      dry_run: ${{ steps.select.outputs.dry_run }}
      test_run: ${{ steps.select.outputs.test_run }}
      publish_main: ${{ steps.select.outputs.publish_main }}
      publish_wasm: ${{ steps.select.outputs.publish_wasm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve platform set
        id: select
        shell: bash
        env:
          INPUT_TYPE: ${{ inputs.type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TEST_RUN: ${{ inputs.test_run }}
        run: |
          set -euo pipefail

          TYPE="${INPUT_TYPE:-}"
          # Publish only when dry_run is explicitly false. A missing or
          # unrecognized value resolves to true, so an absent input can
          # never be read as permission to publish.
          case "${INPUT_DRY_RUN:-}" in
            false) DRY_RUN="false" ;;
            *)     DRY_RUN="true" ;;
          esac

          # Tests run the same way round: only an explicit false skips
          # them, so a missing or unrecognized value can never silently
          # drop the test gate before a publish.
          case "${INPUT_TEST_RUN:-}" in
            false) TEST_RUN="false" ;;
            *)     TEST_RUN="true" ;;
          esac

          case "$TYPE" in
            linux-x64|linux-arm64|linux-s390x|linux-ppc64|win32-x64|win32-arm64|win32-ia32|darwin-arm64|darwin-x64|android-x64|android-arm64|freebsd-x64)
              PLATFORMS="$TYPE"
              PUBLISH_MAIN="false"
              PUBLISH_WASM="false"
              ;;
            wasm)
              # The WebAssembly package only: no platform binaries, so the
              # build matrix resolves to an empty set and the native build
              # job is skipped. The wasm build job is selected by
              # PUBLISH_WASM instead.
              PLATFORMS=""
              PUBLISH_MAIN="false"
              PUBLISH_WASM="true"
              ;;
            all)
              PLATFORMS="linux-x64 win32-x64 darwin-arm64"
              PUBLISH_MAIN="true"
              PUBLISH_WASM="true"
              ;;
            guchho)
              # Main package only: no platform binaries, so the build
              # matrix resolves to an empty set and the build job is
              # skipped in the build job's `if`.
              PLATFORMS=""
              PUBLISH_MAIN="true"
              PUBLISH_WASM="false"
              ;;
            *)
              echo "::error::Unsupported type: '$TYPE'"
              exit 1
              ;;
          esac

          # The supported publish targets, mirroring the build matrix
          # below. Only entries in this list can ever be selected. The
          # main `guchho` package is published when PUBLISH_MAIN is true.
          MATRIX='[
            {"platform":"linux-x64","runner":"ubuntu-latest","method":"native","preset":"release-linux-x64"},
            {"platform":"linux-arm64","runner":"ubuntu-24.04-arm","method":"native","preset":"release-linux-arm64"},
            {"platform":"linux-s390x","runner":"ubuntu-latest","method":"cross","cc":"s390x-linux-gnu-gcc","cxx":"s390x-linux-gnu-g++","cross_packages":"gcc-s390x-linux-gnu g++-s390x-linux-gnu"},
            {"platform":"linux-ppc64","runner":"ubuntu-latest","method":"cross","cc":"powerpc64le-linux-gnu-gcc","cxx":"powerpc64le-linux-gnu-g++","cross_packages":"gcc-powerpc64le-linux-gnu g++-powerpc64le-linux-gnu"},
            {"platform":"darwin-arm64","runner":"macos-latest","method":"native","preset":"release-darwin-arm64"},
            {"platform":"darwin-x64","runner":"macos-15-intel","method":"native","preset":"release-darwin-x64"},
            {"platform":"android-x64","runner":"ubuntu-latest","method":"android","android_abi":"x86_64","android_api":24},
            {"platform":"android-arm64","runner":"ubuntu-latest","method":"android","android_abi":"arm64-v8a","android_api":24},
            {"platform":"freebsd-x64","runner":"ubuntu-latest","method":"freebsd_vm","arch":"x86_64","preset":"release-freebsd-x64"},
            {"platform":"win32-x64","runner":"windows-latest","method":"native","preset":"release-win32-x64-ninja"},
            {"platform":"win32-arm64","runner":"windows-latest","method":"msvc_cross","arch":"ARM64"},
            {"platform":"win32-ia32","runner":"windows-latest","method":"msvc_cross","arch":"Win32"}
          ]'

          SELECTED="$(
            echo "$MATRIX" | node -e '
              const all = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const want = process.argv.slice(1);
              const out = all.filter((e) => want.includes(e.platform));
              if (out.length !== want.length) {
                console.error("matrix is missing a requested platform");
                process.exit(1);
              }
              process.stdout.write(JSON.stringify(out));
            ' $PLATFORMS
          )"

          VERSION="$(node -p "require('./package/npm/guchho/package.json').version")"

          echo "Type:    ${TYPE}"
          echo "Mode:    $([ "$DRY_RUN" = "true" ] && echo 'DRY RUN' || echo 'PUBLISH')"
          echo "Tests:   $([ "$TEST_RUN" = "true" ] && echo 'RUN' || echo 'SKIP')"
          echo "Platform set: ${PLATFORMS:-<none>}"
          echo "Version: ${VERSION}"
          echo "Publish main: ${PUBLISH_MAIN}"
          echo "Publish wasm: ${PUBLISH_WASM}"

          echo "matrix=${SELECTED}" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "test_run=${TEST_RUN}" >> "$GITHUB_OUTPUT"
          echo "publish_main=${PUBLISH_MAIN}" >> "$GITHUB_OUTPUT"
          echo "publish_wasm=${PUBLISH_WASM}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Job 1: Build binaries for selected platforms
  # ============================================
  build:
    needs: plan
    # Main-package-only runs (type=guchho) resolve to an empty platform
    # set / matrix, so the build job is skipped entirely here rather than
    # evaluating an empty matrix or starting runners.
    if: needs.plan.outputs.platforms != ''
    strategy:
      fail-fast: false
      # Resolved by the plan job: only the platforms requested through the
      # `type` input appear here, so unselected platforms never start a
      # runner. The entries themselves (runner, method, preset) are defined
      # in the plan job's MATRIX below.
      #
      # To add a platform: add it to MATRIX in the plan job, to the `type`
      # input options, and (for a publish target) to package/npm/@guchho/.
      #
      # ---- GCC cross-compilers ----
      # - platform: linux-arm
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: arm-linux-gnueabihf-gcc
      #   cxx: arm-linux-gnueabihf-g++
      #   cross_packages: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
      #
      # - platform: linux-ia32
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: gcc
      #   cxx: g++
      #   cross_packages: gcc-multilib g++-multilib
      #   cmake_flags: -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32
      #
      # - platform: linux-riscv64
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: riscv64-linux-gnu-gcc
      #   cxx: riscv64-linux-gnu-g++
      #   cross_packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
      #
      # - platform: linux-mips64el
      #   runner: ubuntu-latest
      #   method: cross
      #   cc: mips64el-linux-gnuabi64-gcc
      #   cxx: mips64el-linux-gnuabi64-g++
      #   cross_packages: gcc-mips64el-linux-gnuabi64 g++-mips64el-linux-gnuabi64
      #
      # ---- Docker (only where no cross-compiler exists) ----
      # - platform: linux-loong64
      #   runner: ubuntu-latest
      #   method: docker
      #   docker_image: ghcr.io/loong64/loongnix:25
      #
      # ---- Android NDK cross-compilation ----
      # - platform: android-arm
      #   runner: ubuntu-latest
      #   method: android
      #   android_abi: armeabi-v7a
      #   android_api: 24
      #
      # The plan job emits the entries as a JSON array; strategy.matrix takes
      # that array through `include`, which is the mapping form it evaluates
      # to (a bare array at this level is rejected as "A sequence was not
      # expected"). With include as the only key, each entry becomes one job.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ============================================
      # Native builds (Linux, macOS, Windows)
      # ============================================
      - name: Setup CMake (native)
        if: matrix.method == 'native'
        uses: lukka/get-cmake@latest

      - name: Setup Ninja (native)
        if: matrix.method == 'native'
        run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build || true
          fi
        shell: bash

      # The default Xcode on the macos-15-intel image is 16.4, whose libc++
      # predates std::from_chars/std::to_chars for floating point (those
      # arrived in libc++ v20), so the CSS/JS number-parsing code does not
      # compile there while it builds fine on macos-26-arm64 (Xcode 26,
      # image default). Both images ship several Xcode versions side by side,
      # so select the newest one available and leave the default untouched
      # when there is nothing to pick.
      #
      # Keep this script simple: macOS runners execute run: steps with
      # /bin/bash 3.2, which rejects a `case ... in ''|*[!0-9.]* )` pattern
      # ("syntax error near unexpected token `;;'"), so the version filter
      # is done with grep. `sort -t. -kN,Nn` is used instead of `sort -V`
      # because BSD sort has no -V. The pipeline ends in `|| true` so an
      # empty /Applications (or a grep with no matches) does not trip `set -e`.
      - name: Select Xcode (native macOS)
        if: matrix.method == 'native' && runner.os == 'macOS'
        run: |
          versions=$(for app in /Applications/Xcode_[0-9]*.app; do
            [ -d "$app" ] || continue
            ver="${app##*/Xcode_}"
            printf '%s\n' "${ver%.app}"
          done | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n) || true

          echo "Available Xcode versions:"
          printf '%s\n' "$versions" | sed 's/^/  /'
          echo "Current developer dir: $(xcode-select -p)"

          if [ -n "$versions" ]; then
            best=$(printf '%s\n' "$versions" | tail -n 1)
            sudo xcode-select -s "/Applications/Xcode_${best}.app"
          fi
          xcodebuild -version
        shell: bash

      - name: Build (native)
        if: matrix.method == 'native'
        run: |
          cmake --preset ${{ matrix.preset }} --fresh
          cmake --build --preset ${{ matrix.preset }} --parallel
        shell: bash

      # Run the suite on the machine that just built it. Only a native
      # build can execute what it compiled; cross/docker/MSVC/Android
      # builds pass -DBUILD_TESTING=OFF. Gated on the test_run input
      # (resolved by the plan job, default true). When it runs, a test
      # failure fails this job, and the validate gate
      # (needs.build.result == 'success') then skips both publish jobs,
      # so nothing ships.
      - name: Test (native)
        if: matrix.method == 'native' && needs.plan.outputs.test_run == 'true'
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
        shell: bash

      - name: Find binary (native)
        if: matrix.method == 'native'
        id: find_binary
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          PRESET="${{ matrix.preset }}"

          if [[ "$PLATFORM" == win32-* ]]; then
            BINARY_NAME="guchho.exe"
          else
            BINARY_NAME="guchho"
          fi

          SEARCH_PATHS=(
            "build/${PRESET}/bin/${BINARY_NAME}"
            "build/${PRESET}/bin/Release/${BINARY_NAME}"
            "build/${PRESET}/${BINARY_NAME}"
          )

          FOUND=""
          for p in "${SEARCH_PATHS[@]}"; do
            if [[ -f "$p" ]]; then
              FOUND="$p"
              break
            fi
          done

          if [[ -z "$FOUND" ]]; then
            echo "::error::Could not find binary for ${PLATFORM}"
            echo "Searched:"
            for p in "${SEARCH_PATHS[@]}"; do echo "  $p"; done
            exit 1
          fi

          echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "Found: ${FOUND}"

      # ============================================
      # GCC cross-compilation
      # ============================================
      - name: Install cross-compiler
        if: matrix.method == 'cross'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Build (GCC cross-compile)
        if: matrix.method == 'cross'
        run: |
          cmake -B build/release-${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_C_EXTENSIONS=OFF \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DBUILD_TESTING=OFF \
            ${{ matrix.cmake_flags || '' }}
          cmake --build build/release-${{ matrix.platform }} --parallel
        shell: bash

      - name: Find binary (cross)
        if: matrix.method == 'cross'
        id: find_binary_cross
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BINARY_NAME="guchho"
          FOUND="build/release-${PLATFORM}/bin/${BINARY_NAME}"

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::warning::Could not find binary for ${PLATFORM}"
            echo "binary_path=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================
      # Linux Docker cross-compilation (loong64 only)
      # ============================================
      - name: Setup QEMU (Docker)
        if: matrix.method == 'docker'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/loong64

      - name: Build (Docker cross-compile)
        if: matrix.method == 'docker'
        run: |
          docker run --rm --platform linux/loong64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ${{ matrix.docker_image }} \
            bash -c "
              apt-get -o Acquire::https::Verify-Peer=false update && apt-get -o Acquire::https::Verify-Peer=false install -y cmake ninja-build g++ pkg-config &&
              cmake -B build/release-${{ matrix.platform }} \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_STANDARD=17 \
                -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_C_STANDARD_REQUIRED=ON \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON \
                -DCMAKE_C_EXTENSIONS=OFF \
                -DCMAKE_CXX_EXTENSIONS=OFF \
                -DBUILD_TESTING=OFF &&
              cmake --build build/release-${{ matrix.platform }} --parallel
            "
        shell: bash

      - name: Find binary (Docker)
        if: matrix.method == 'docker'
        id: find_binary_docker
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          PRESET="release-${PLATFORM}"
          BINARY_NAME="guchho"

          SEARCH_PATHS=(
            "build/${PRESET}/bin/${BINARY_NAME}"
            "build/${PRESET}/${BINARY_NAME}"
          )

          FOUND=""
          for p in "${SEARCH_PATHS[@]}"; do
            if [[ -f "$p" ]]; then
              FOUND="$p"
              break
            fi
          done

          if [[ -z "$FOUND" ]]; then
            echo "::warning::Could not find binary for ${PLATFORM} (cross-compile may not produce output in expected location)"
            mkdir -p "package/npm/@guchho/${PLATFORM}/bin"
            echo "binary_path=package/npm/@guchho/${PLATFORM}/bin/${BINARY_NAME}" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          fi

      # ============================================
      # Windows MSVC cross-compilation
      # ============================================
      - name: Build (MSVC cross)
        if: matrix.method == 'msvc_cross'
        run: |
          cmake -B build/release-${{ matrix.platform }} \
            -G "Visual Studio 18 2026" \
            -A ${{ matrix.arch }} \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          cmake --build build/release-${{ matrix.platform }} --config Release --parallel
        shell: bash

      - name: Find binary (MSVC cross)
        if: matrix.method == 'msvc_cross'
        id: find_binary_msvc
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BINARY_NAME="guchho.exe"
          FOUND="build/release-${PLATFORM}/bin/Release/${BINARY_NAME}"

          if [[ ! -f "$FOUND" ]]; then
            FOUND="build/release-${PLATFORM}/bin/${BINARY_NAME}"
          fi

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::warning::Could not find binary for ${PLATFORM}"
            echo "binary_path=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================
      # Android NDK cross-compilation
      # ============================================
      - name: Setup Android NDK
        if: matrix.method == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build (Android NDK)
        if: matrix.method == 'android'
        run: |
          # The C++ runtime is linked statically. With c++_shared the binary
          # needs libc++_shared.so at run time, and neither the NDK's CMake
          # toolchain nor this workflow puts that library next to it or
          # records a run path to it, so the packaged binary would stop at
          # startup on a device with "cannot open shared object file". A
          # command line tool has no other shared library to share with, so
          # the runtime belongs inside the binary.
          cmake -B build/release-${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.android_api }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_C_STANDARD=17 \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_C_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
          cmake --build build/release-${{ matrix.platform }} --parallel
        shell: bash

      - name: Find binary (Android)
        if: matrix.method == 'android'
        id: find_binary_android
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BINARY_NAME="guchho"
          FOUND="build/release-${PLATFORM}/bin/${BINARY_NAME}"

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::warning::Could not find binary for ${PLATFORM}"
            echo "binary_path=" >> "$GITHUB_OUTPUT"
          fi

      # ============================================
      # FreeBSD (QEMU VM)
      # ============================================
      #
      # GitHub's hosted runners have no FreeBSD image, so the build happens
      # inside a real FreeBSD VM booted on an Ubuntu runner. The workspace is
      # synced into the VM before `run` and back out afterwards, so the binary
      # and the build tree land on the host for the packaging steps below.
      #
      # The FreeBSD toolchain strips the binary inside the VM: the host's GNU
      # strip can read a FreeBSD ELF, but the VM's own strip is the tool that
      # matches the target and there is no reason to depend on the other.
      - name: Build and test (FreeBSD VM)
        if: matrix.method == 'freebsd_vm'
        uses: vmactions/freebsd-vm@v1
        with:
          # FreeBSD guarantees that a binary built on an older release runs on
          # newer ones, but not the reverse, so build against the current 14.x
          # line rather than the newest 15.x: one binary then covers both.
          release: "14"
          arch: x86_64
          sync: rsync
          prepare: |
            pkg install -y cmake ninja
          run: |
            set -e

            cmake --preset ${{ matrix.preset }} --fresh
            cmake --build --preset ${{ matrix.preset }} --parallel

            if [ "${{ needs.plan.outputs.test_run }}" = "true" ]; then
              ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
            fi

            strip "build/${{ matrix.preset }}/bin/guchho" 2>/dev/null || true

      # `sync: rsync` copies the tree back after `run`, so by this point the
      # binary exists on the host at the same path the native presets use.
      - name: Find binary (FreeBSD)
        if: matrix.method == 'freebsd_vm'
        id: find_binary_freebsd
        shell: bash
        run: |
          FOUND="build/${{ matrix.preset }}/bin/guchho"

          if [[ -f "$FOUND" ]]; then
            echo "binary_path=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "Found: ${FOUND}"
          else
            echo "::error::Could not find the FreeBSD binary at ${FOUND}"
            exit 1
          fi

      # ============================================
      # Copy binary to package directory
      # ============================================
      - name: Prepare package directory
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          PKG_DIR="package/npm/@guchho/${PLATFORM}"
          mkdir -p "${PKG_DIR}/bin"

          # Determine binary name
          if [[ "$PLATFORM" == win32-* ]]; then
            BINARY_NAME="guchho.exe"
          else
            BINARY_NAME="guchho"
          fi

          # Find the binary from the appropriate step
          BINARY_PATH=""
          for step_output in \
            "${{ steps.find_binary.outputs.binary_path }}" \
            "${{ steps.find_binary_cross.outputs.binary_path }}" \
            "${{ steps.find_binary_docker.outputs.binary_path }}" \
            "${{ steps.find_binary_msvc.outputs.binary_path }}" \
            "${{ steps.find_binary_android.outputs.binary_path }}" \
            "${{ steps.find_binary_freebsd.outputs.binary_path }}"; do
            if [[ -n "$step_output" && -f "$step_output" ]]; then
              BINARY_PATH="$step_output"
              break
            fi
          done

          if [[ -n "$BINARY_PATH" && -f "$BINARY_PATH" ]]; then
            cp "$BINARY_PATH" "${PKG_DIR}/bin/${BINARY_NAME}"

            # Strip debug symbols on Unix. The runner's strip reads the
            # host's own binaries only, so an Android build is stripped with
            # the NDK's llvm-strip, which knows the target's format, and a
            # FreeBSD build is stripped inside the VM (see the FreeBSD build
            # step above). Both still need the executable bit here.
            if [[ "$PLATFORM" != win32-* ]]; then
              chmod +x "${PKG_DIR}/bin/${BINARY_NAME}"
              NDK_STRIP="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
              if [[ "$PLATFORM" == android-* && -x "${NDK_STRIP}" ]]; then
                "${NDK_STRIP}" "${PKG_DIR}/bin/${BINARY_NAME}" 2>/dev/null || true
              elif [[ "$PLATFORM" != freebsd-* ]]; then
                strip "${PKG_DIR}/bin/${BINARY_NAME}" 2>/dev/null || true
              fi
            fi

            echo "Copied binary to ${PKG_DIR}/bin/${BINARY_NAME}"
            ls -lh "${PKG_DIR}/bin/${BINARY_NAME}"

            # The runner builds win32 with MinGW, and a MinGW binary is not one
            # file: the C++ runtime lives in shared libraries beside the
            # executable, and Windows finds them in the executable's own
            # directory. Shipping the executable alone produces a package that
            # runs on the machine that built it and fails everywhere else with
            # STATUS_DLL_NOT_FOUND (0xC0000135). Copy whatever the build
            # produced beside the binary, as scripts/build-npm.sh does.
            if [[ "$PLATFORM" == win32-* ]]; then
              RUNTIME_DIR="$(dirname "$BINARY_PATH")"
              for candidate in "${RUNTIME_DIR}"/*.dll; do
                [[ -f "${candidate}" ]] || continue
                cp "${candidate}" "${PKG_DIR}/bin/"
                echo "Copied runtime library $(basename "${candidate}")"
              done
            fi
          else
            # A platform package without a binary is not publishable, and an
            # empty one would install and fail at runtime. Fail here, before
            # anything is uploaded or published.
            echo "::error::No binary found for ${PLATFORM} — refusing to package an empty package"
            exit 1
          fi

      - name: Setup Node.js (JS package tests)
        if: matrix.method == 'native' && needs.plan.outputs.test_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The JS suite exercises the staged tree — manifest, installer, tarball,
      # and the JS API — against the binary Prepare package directory just
      # placed. GUCHHO_REQUIRE_BINARY=1 makes a missing binary a failure rather
      # than a skip, so a green run is evidence the binary was actually run.
      # Only native builds qualify: a cross-built binary cannot execute on the
      # runner that produced it.
      - name: Test npm package (JS)
        if: matrix.method == 'native' && needs.plan.outputs.test_run == 'true'
        shell: bash
        env:
          GUCHHO_REQUIRE_BINARY: "1"
        run: bash scripts/test-npm.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform }}
          path: package/npm/@guchho/${{ matrix.platform }}/
          retention-days: 1

      # ============================================
      # Windows x64 release archive
      # ============================================
      #
      # CPack, not the build, is what turns the compiled install tree into the
      # portable release archive the docs promise: guchho-<version>-win32-x64.zip.
      # It is generated here, for the Windows x64 platform only, so the same
      # workflow run that compiles the binary also publishes a downloadable
      # archive. The generator is forced to ZIP because the configured default
      # is "ZIP;NSIS" and NSIS is not installed on the runner.
      - name: Package release archive (win32-x64)
        if: matrix.platform == 'win32-x64'
        id: release_archive
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          PRESET="${{ matrix.preset }}"
          STAGE="release-artifacts"
          mkdir -p "${STAGE}"

          cpack -G ZIP -B "${STAGE}" --config "build/${PRESET}/CPackConfig.cmake"

          ARCHIVE="${STAGE}/guchho-${VERSION}-win32-x64.zip"

          # CPack names the archive from the CMake project version. That is
          # the same number as the package metadata, but the two are written
          # by hand, so if they ever drift the produced file is moved to the
          # name this workflow promises rather than failing on a mismatch.
          if [[ ! -f "${ARCHIVE}" ]]; then
            GENERATED="$(ls "${STAGE}"/guchho-*-win32-x64.zip 2>/dev/null | head -n 1 || true)"
            if [[ -n "${GENERATED}" ]]; then
              mv "${GENERATED}" "${ARCHIVE}"
            fi
          fi

          # An absent or empty archive must fail the job: uploading nothing
          # would let the workflow report success with no downloadable file.
          if [[ ! -s "${ARCHIVE}" ]]; then
            echo "::error::Windows release archive ${ARCHIVE} was not generated"
            ls -la "${STAGE}" || true
            exit 1
          fi

          echo "archive_path=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "Built release archive: ${ARCHIVE}"

      - name: Upload Windows release archive
        if: matrix.platform == 'win32-x64'
        uses: actions/upload-artifact@v4
        with:
          name: guchho-win32-x64
          path: ${{ steps.release_archive.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1

  # ============================================
  # Job 1b: Build the WebAssembly engine
  # ============================================
  #
  # Only runs when @guchho/wasm is part of the requested set (type=wasm or
  # type=all). The engine is platform-independent — one artifact serves every
  # OS and the browser — so it is a single runner rather than a matrix entry.
  # scripts/build-wasm.sh configures the wasm32-emscripten preset, builds it,
  # refuses to continue if the gzip'd binary is over the size budget, and
  # copies the glue and binary into package/npm/@guchho/wasm/lib.
  build-wasm:
    needs: plan
    if: needs.plan.outputs.publish_wasm == 'true'
    runs-on: ubuntu-latest
    name: build (wasm)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # Pin the Emscripten SDK so the artifact is reproducible: a newer SDK
      # can change the glue, the binary, or both.
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.12"

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build WebAssembly engine
        run: bash scripts/build-wasm.sh

      # The pack and engine smokes: the tarball holds the glue and the binary,
      # and the engine in it actually builds a project. These skip when no
      # engine was built, so running them here is what makes them mean
      # something.
      - name: Test WebAssembly package
        run: bash scripts/test-npm.sh --filter wasm-package

      - name: Upload WebAssembly package artifact
        uses: actions/upload-artifact@v6
        with:
          name: npm-wasm
          path: package/npm/@guchho/wasm/
          retention-days: 1

  # ============================================
  # Job 2: Validate artifacts, versions and packages
  # ============================================
  #
  # Everything that can be checked before publishing is checked here, so a
  # bad artifact or a version mismatch fails the workflow while nothing has
  # been published yet. This job never publishes anything.
  validate:
    needs: [plan, build, build-wasm]
    # For a main-package-only run (type=guchho) the build job is skipped by
    # design; `always()` is required because a job that `needs` a skipped
    # job is itself skipped when its `if` is merely true. The conditions
    # below keep the gate intact: when platforms were requested they must
    # have built successfully, and likewise when the wasm package was
    # requested its build must have succeeded.
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.plan.outputs.platforms == '') &&
      (needs.build-wasm.result == 'success' || needs.plan.outputs.publish_wasm != 'true')
    runs-on: ubuntu-latest
    name: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download artifacts
        if: needs.plan.outputs.platforms != ''
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: package-*

      # The wasm artifact is a single directory, not the package-* set, so it
      # is fetched by name and placed straight into its package directory.
      - name: Download WebAssembly artifact
        if: needs.plan.outputs.publish_wasm == 'true'
        uses: actions/download-artifact@v7
        with:
          name: npm-wasm
          path: package/npm/@guchho/wasm/

      - name: Sync artifacts to package directory
        if: needs.plan.outputs.platforms != ''
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          synced=0
          for dir in artifacts/*/; do
            NAME=$(basename "$dir")
            case "$NAME" in
              package-*)
                PLATFORM="${NAME#package-}"
                DEST="package/npm/@guchho/${PLATFORM}"
                mkdir -p "${DEST}"
                cp -r "${dir}"* "${DEST}/"
                echo "Synced: ${PLATFORM}"
                synced=1
                ;;
            esac
          done
          # download-artifact extracts a single pattern-matched artifact
          # directly into the path instead of a package-<platform>/
          # directory, so fall back to the resolved platform set.
          if [[ "$synced" -eq 0 ]]; then
            for PLATFORM in ${PUBLISH_PLATFORMS}; do
              DEST="package/npm/@guchho/${PLATFORM}"
              mkdir -p "${DEST}"
              cp -r artifacts/* "${DEST}/"
              echo "Synced: ${PLATFORM}"
            done
          fi

          # upload-artifact and download-artifact do not preserve file
          # permission bits: every file comes back 644, so the chmod +x the
          # build job ran before uploading is gone by the time npm pack reads
          # the binary. npm records the mode the file has, so without this the
          # published package ships a non-executable binary and every Unix
          # install fails with "Permission denied". Windows is exempt: .exe
          # has no execute bit to lose.
          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            case "$PLATFORM" in
              win32-*) continue ;;
            esac
            BIN="package/npm/@guchho/${PLATFORM}/bin/guchho"
            if [[ -f "$BIN" ]]; then
              chmod +x "$BIN"
            fi
          done

      # Versions are compared, never rewritten. The expected version comes
      # from the main package manifest; for a platform run only the selected
      # package is checked, for `all` every package involved is checked along
      # with the optionalDependencies pins that tie the main package to them.
      - name: Validate package versions
        shell: bash
        env:
          PUBLISH_TYPE: ${{ needs.plan.outputs.type }}
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PUBLISH_WASM: ${{ needs.plan.outputs.publish_wasm }}
          PUBLISH_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          const type = process.env.PUBLISH_TYPE;
          const platforms = (process.env.PUBLISH_PLATFORMS || "").split(/\s+/).filter(Boolean);
          const publishWasm = process.env.PUBLISH_WASM === "true";
          const expected = process.env.PUBLISH_VERSION;
          const SEMVER = /^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$/;

          let failures = 0;
          const fail = (msg) => {
            console.log(`::error::${msg}`);
            failures++;
          };

          const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));

          if (!expected || !SEMVER.test(expected)) {
            fail(`expected version '${expected}' is not valid semver`);
          }

          const main = read("package/npm/guchho/package.json");
          if (main.name !== "guchho") {
            fail(`main package is named '${main.name}', expected 'guchho'`);
          }
          if (main.version !== expected) {
            fail(`package/npm/guchho/package.json says ${main.version}, expected ${expected}`);
          }

          for (const p of platforms) {
            const manifest = `package/npm/@guchho/${p}/package.json`;
            if (!fs.existsSync(manifest)) {
              fail(`missing ${manifest}`);
              continue;
            }
            const pkg = read(manifest);
            if (pkg.name !== `@guchho/${p}`) {
              fail(`${manifest} is named '${pkg.name}', expected '@guchho/${p}'`);
            }
            if (typeof pkg.version !== "string" || !SEMVER.test(pkg.version)) {
              fail(`${manifest} version '${pkg.version}' is not valid semver`);
            } else if (pkg.version !== expected) {
              fail(`${manifest} is ${pkg.version}, expected ${expected} (main package version)`);
            }
          }

          if (type === "all") {
            const pins = main.optionalDependencies || {};
            for (const p of platforms) {
              const pin = pins[`@guchho/${p}`];
              if (pin !== expected) {
                fail(`optionalDependencies pin for @guchho/${p} is '${pin}', expected '${expected}'`);
              }
            }
          }

          if (type === "guchho") {
            const pins = main.optionalDependencies || {};
            for (const dep of Object.keys(pins)) {
              const pin = pins[dep];
              if (pin !== expected) {
                fail(`optionalDependencies pin for ${dep} is '${pin}', expected '${expected}'`);
              }
            }
          }

          // The wasm package is published alongside the native ones but is
          // deliberately not an optionalDependency of the main package, so
          // only its own name and version are checked.
          if (publishWasm) {
            const manifest = "package/npm/@guchho/wasm/package.json";
            if (!fs.existsSync(manifest)) {
              fail(`missing ${manifest}`);
            } else {
              const wasm = read(manifest);
              if (wasm.name !== "@guchho/wasm") {
                fail(`${manifest} is named '${wasm.name}', expected '@guchho/wasm'`);
              }
              if (typeof wasm.version !== "string" || !SEMVER.test(wasm.version)) {
                fail(`${manifest} version '${wasm.version}' is not valid semver`);
              } else if (wasm.version !== expected) {
                fail(`${manifest} is ${wasm.version}, expected ${expected} (main package version)`);
              }
            }
          }

          if (failures > 0) {
            console.log(`::error::Version validation failed (${failures} problem(s)) -- not publishing`);
            process.exit(1);
          }
          console.log(`All selected packages agree on version ${expected}`);
          EOF

      # The last gate before anything can be published: the expected binary
      # is present in the assembled package, and npm can pack it. A dry run
      # stops at this point with a full listing of what a publish would
      # upload.
      - name: Validate package contents
        shell: bash
        env:
          PUBLISH_TYPE: ${{ needs.plan.outputs.type }}
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PKG="package/npm/@guchho/${PLATFORM}"

            if [[ "$PLATFORM" == win32-* ]]; then
              BINARY="${PKG}/bin/guchho.exe"
            else
              BINARY="${PKG}/bin/guchho"
            fi

            echo "========================================"
            echo "Validating @guchho/${PLATFORM}"
            echo "========================================"

            if [[ ! -f "${PKG}/package.json" ]]; then
              echo "::error::${PKG}/package.json is missing"
              exit 1
            fi

            if [[ ! -f "${BINARY}" ]]; then
              echo "::error::expected binary ${BINARY} is missing from the package"
              exit 1
            fi

            if [[ ! -s "${BINARY}" ]]; then
              echo "::error::binary ${BINARY} is empty"
              exit 1
            fi

            # The binary must be executable in the tree npm packs, or the
            # published package ships a file every Unix install fails to run
            # with "Permission denied" (exit 126). The chmod in the sync step
            # keeps this true after an artifact download strips the bits;
            # this gate fails the workflow before publish if it ever isn't.
            if [[ "$PLATFORM" != win32-* ]] && [[ ! -x "${BINARY}" ]]; then
              echo "::error::binary ${BINARY} is not executable"
              exit 1
            fi

            echo "npm pack --dry-run for @guchho/${PLATFORM}:"
            npm pack "${PKG}" --dry-run 2>&1
            echo ""
          done

      # The last gate before the wasm package can be published: the built
      # engine is present in the package, no preload .data crept back in,
      # the binary is inside the size budget, and npm can pack it.
      - name: Validate WebAssembly package contents
        if: needs.plan.outputs.publish_wasm == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PKG="package/npm/@guchho/wasm"

          echo "========================================"
          echo "Validating @guchho/wasm"
          echo "========================================"

          for f in package.json index.mjs index.cjs bin/guchho.js lib/guchho.js lib/guchho.wasm; do
            if [[ ! -s "${PKG}/${f}" ]]; then
              echo "::error::${PKG}/${f} is missing or empty"
              exit 1
            fi
          done

          # A preload .data file would mean the engine shipped with baked-in
          # sample files and double the download for nothing; production
          # projects arrive through the NODEFS/MEMFS mount instead.
          if [[ -e "${PKG}/lib/guchho.data" ]]; then
            echo "::error::a .data preload file must not be in the package"
            exit 1
          fi

          # Same 3 MiB gzip budget the build script enforces, checked once
          # more on the artifact that actually gets packed.
          GZIP_BYTES=$(gzip -9 -c "${PKG}/lib/guchho.wasm" | wc -c)
          echo "lib/guchho.wasm: ${GZIP_BYTES} bytes gzip -9"
          if [[ "${GZIP_BYTES}" -gt $((3 * 1024 * 1024)) ]]; then
            echo "::error::lib/guchho.wasm exceeds the 3 MiB gzip size budget"
            exit 1
          fi

          echo "npm pack --dry-run for @guchho/wasm:"
          npm pack "${PKG}" --dry-run 2>&1

  # ============================================
  # Job 3: Publish platform packages
  # ============================================
  publish-platforms:
    needs: [plan, validate]
    # Main-package-only runs (type=guchho) select no platforms, so there is
    # nothing for this job to build-sync, validate, or publish. `always()`
    # opts out of the skip cascade (validate is a `needs` dependency) while
    # the conditions keep all gates: plan and validate must have succeeded.
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.platforms != '' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    name: publish-platforms
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts/
          pattern: package-*

      - name: Sync artifacts to package directory
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          synced=0
          for dir in artifacts/*/; do
            NAME=$(basename "$dir")
            case "$NAME" in
              package-*)
                PLATFORM="${NAME#package-}"
                DEST="package/npm/@guchho/${PLATFORM}"
                mkdir -p "${DEST}"
                cp -r "${dir}"* "${DEST}/"
                echo "Synced: ${PLATFORM}"
                synced=1
                ;;
            esac
          done
          # download-artifact extracts a single pattern-matched artifact
          # directly into the path instead of a package-<platform>/
          # directory, so fall back to the resolved platform set.
          if [[ "$synced" -eq 0 ]]; then
            for PLATFORM in ${PUBLISH_PLATFORMS}; do
              DEST="package/npm/@guchho/${PLATFORM}"
              mkdir -p "${DEST}"
              cp -r artifacts/* "${DEST}/"
              echo "Synced: ${PLATFORM}"
            done
          fi

          # upload-artifact and download-artifact do not preserve file
          # permission bits: every file comes back 644, so the chmod +x the
          # build job ran before uploading is gone by the time npm pack reads
          # the binary. npm records the mode the file has, so without this the
          # published package ships a non-executable binary and every Unix
          # install fails with "Permission denied". Windows is exempt: .exe
          # has no execute bit to lose.
          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            case "$PLATFORM" in
              win32-*) continue ;;
            esac
            BIN="package/npm/@guchho/${PLATFORM}/bin/guchho"
            if [[ -f "$BIN" ]]; then
              chmod +x "$BIN"
            fi
          done

      # Dry run: show exactly what a publish would upload, and never call
      # npm publish. The publish step below is the only place in this
      # workflow that can publish, and it is gated on an explicit
      # dry_run=false.
      - name: "Dry run: pack selected packages"
        if: needs.plan.outputs.dry_run != 'false'
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PKG="package/npm/@guchho/${PLATFORM}"
            NAME=$(node -p "require('./${PKG}/package.json').name")
            VERSION=$(node -p "require('./${PKG}/package.json').version")

            if [[ "$PLATFORM" == win32-* ]]; then
              BINARY="${PKG}/bin/guchho.exe"
            else
              BINARY="${PKG}/bin/guchho"
            fi

            if [[ ! -f "${BINARY}" ]]; then
              echo "::error::expected binary ${BINARY} is missing"
              exit 1
            fi

            echo "========================================"
            echo "[DRY RUN] Would publish ${NAME}@${VERSION}"
            echo "========================================"
            npm pack "${PKG}" --dry-run 2>&1
            echo ""
          done

          echo "No packages were published."

      - name: Publish platform packages
        if: needs.plan.outputs.dry_run == 'false'
        shell: bash
        env:
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PKG="package/npm/@guchho/${PLATFORM}"
            NAME=$(node -p "require('./${PKG}/package.json').name")
            VERSION=$(node -p "require('./${PKG}/package.json').version")

            if [[ "$PLATFORM" == win32-* ]]; then
              BINARY="${PKG}/bin/guchho.exe"
            else
              BINARY="${PKG}/bin/guchho"
            fi

            if [[ ! -f "${BINARY}" ]]; then
              echo "::error::expected binary ${BINARY} is missing -- not publishing"
              exit 1
            fi

            echo "========================================"
            echo "Publishing: ${NAME}@${VERSION}"
            echo "========================================"

            # A failed publish fails the workflow: swallowing it would let
            # the main package publish on top of an incomplete set.
            if ! npm publish "${PKG}" --access public --provenance 2>&1; then
              echo "::error::Failed to publish ${NAME}@${VERSION}"
              exit 1
            fi

            echo ""
          done

  # ============================================
  # Job 4: Publish WebAssembly package (type=wasm or type=all)
  # ============================================
  #
  # For `all` it runs after the platform packages, so the wasm engine is
  # never published on top of a partial native set. For `wasm` (no platforms
  # selected) publish-platforms is skipped by design and the engine is
  # published on its own after validation succeeds. `always()` is used
  # because a job with `needs` is skipped whenever a needed job is skipped,
  # even when its `if` would be true; the conditions below keep every real
  # gate intact.
  publish-wasm:
    needs: [plan, validate, publish-platforms]
    if: >-
      always() &&
      needs.plan.outputs.publish_wasm == 'true' &&
      needs.plan.result == 'success' &&
      needs.validate.result == 'success' &&
      (needs.plan.outputs.platforms == '' &&
      needs.publish-platforms.result == 'skipped' ||
      needs.plan.outputs.platforms != '' &&
      needs.publish-platforms.result == 'success')
    runs-on: ubuntu-latest
    name: publish-wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Download WebAssembly artifact
        uses: actions/download-artifact@v7
        with:
          name: npm-wasm
          path: package/npm/@guchho/wasm/

      - name: Validate WebAssembly package
        shell: bash
        env:
          PUBLISH_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          PKG="package/npm/@guchho/wasm"
          NAME=$(node -p "require('./${PKG}/package.json').name")
          VERSION=$(node -p "require('./${PKG}/package.json').version")

          if [[ "$NAME" != "@guchho/wasm" ]]; then
            echo "::error::wasm package is named '${NAME}', expected '@guchho/wasm'"
            exit 1
          fi

          if [[ "$VERSION" != "$PUBLISH_VERSION" ]]; then
            echo "::error::wasm package is ${VERSION}, expected ${PUBLISH_VERSION}"
            exit 1
          fi

          for f in index.mjs index.cjs bin/guchho.js lib/guchho.js lib/guchho.wasm; do
            if [[ ! -s "${PKG}/${f}" ]]; then
              echo "::error::${PKG}/${f} is missing or empty -- not publishing"
              exit 1
            fi
          done

          echo "Validated @guchho/wasm@${VERSION}"
          npm pack "${PKG}" --dry-run 2>&1

      # Dry run: show exactly what a publish would upload, and never call
      # npm publish. The publish step below is the only place in this job
      # that can publish, and it is gated on an explicit dry_run=false.
      - name: "Dry run: pack WebAssembly package"
        if: needs.plan.outputs.dry_run != 'false'
        shell: bash
        run: |
          NAME=$(node -p "require('./package/npm/@guchho/wasm/package.json').name")
          VERSION=$(node -p "require('./package/npm/@guchho/wasm/package.json').version")
          echo "[DRY RUN] Would publish ${NAME}@${VERSION}"
          echo "No packages were published."

      - name: Publish WebAssembly package
        if: needs.plan.outputs.dry_run == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package/npm/@guchho/wasm/package.json').name")
          VERSION=$(node -p "require('./package/npm/@guchho/wasm/package.json').version")

          echo "========================================"
          echo "Publishing: ${NAME}@${VERSION}"
          echo "========================================"

          if ! npm publish package/npm/@guchho/wasm --access public --provenance 2>&1; then
            echo "::error::Failed to publish ${NAME}@${VERSION}"
            exit 1
          fi

  # ============================================
  # Job 5: Publish main package (last, type=guchho or type=all)
  # ============================================
  #
  # For `all` it is gated on the platform packages having succeeded: a
  # failure anywhere upstream leaves publish-platforms != 'success' and
  # this job is skipped, so a partial platform set can never be topped
  # with a main package. For `guchho` (no platforms selected) the
  # publish-platforms job is skipped by design and the main package is
  # published on its own after validation succeeds. `always()` is used
  # because a job with `needs` is skipped whenever any needed job is
  # skipped, even when its `if` would be true; the conditions below keep
  # every real gate intact.
  publish-main:
    needs: [plan, validate, publish-platforms, publish-wasm]
    # `always()` opts out of the skip cascade for type=guchho, where
    # publish-platforms and publish-wasm are intentionally skipped; the
    # conditions below then enforce the real gates (see comment above the
    # job). For `all` the main package is only published once both the
    # platform packages and the wasm package have succeeded.
    if: >-
      always() &&
      needs.plan.outputs.publish_main == 'true' &&
      needs.plan.result == 'success' &&
      needs.validate.result == 'success' &&
      (needs.plan.outputs.platforms == '' &&
      needs.publish-platforms.result == 'skipped' ||
      needs.plan.outputs.platforms != '' &&
      needs.publish-platforms.result == 'success') &&
      (needs.plan.outputs.publish_wasm != 'true' ||
      needs.publish-wasm.result == 'success')
    runs-on: ubuntu-latest
    name: publish-main
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Validate main package
        shell: bash
        env:
          PUBLISH_TYPE: ${{ needs.plan.outputs.type }}
          PUBLISH_PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PUBLISH_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package/npm/guchho/package.json').name")
          VERSION=$(node -p "require('./package/npm/guchho/package.json').version")

          if [[ "$NAME" != "guchho" ]]; then
            echo "::error::main package is named '${NAME}', expected 'guchho'"
            exit 1
          fi

          if [[ "$VERSION" != "$PUBLISH_VERSION" ]]; then
            echo "::error::main package is ${VERSION}, expected ${PUBLISH_VERSION}"
            exit 1
          fi

          for PLATFORM in ${PUBLISH_PLATFORMS}; do
            PIN=$(node -p "require('./package/npm/guchho/package.json').optionalDependencies['@guchho/${PLATFORM}']")
            if [[ "$PIN" != "$PUBLISH_VERSION" ]]; then
              echo "::error::optionalDependencies pin for @guchho/${PLATFORM} is '${PIN}', expected '${PUBLISH_VERSION}'"
              exit 1
            fi
          done

          echo "Validated guchho@${VERSION}"
          echo "npm pack --dry-run for guchho:"
          npm pack package/npm/guchho --dry-run 2>&1

      - name: "Dry run: pack main package"
        if: needs.plan.outputs.dry_run != 'false'
        shell: bash
        run: |
          NAME=$(node -p "require('./package/npm/guchho/package.json').name")
          VERSION=$(node -p "require('./package/npm/guchho/package.json').version")
          echo "[DRY RUN] Would publish ${NAME}@${VERSION}"
          echo "No packages were published."

      - name: Publish main package
        if: needs.plan.outputs.dry_run == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package/npm/guchho/package.json').name")
          VERSION=$(node -p "require('./package/npm/guchho/package.json').version")

          echo "========================================"
          echo "Publishing: ${NAME}@${VERSION}"
          echo "========================================"

          if ! npm publish package/npm/guchho --access public --provenance 2>&1; then
            echo "::error::Failed to publish ${NAME}@${VERSION}"
            exit 1
          fi

  # ============================================
  # Summary
  # ============================================
  summary:
    needs: [plan, build, build-wasm, validate, publish-platforms, publish-wasm, publish-main]
    runs-on: ubuntu-latest
    if: always()
    name: summary
    steps:
      - name: Write job summary
        shell: bash
        env:
          TYPE: ${{ needs.plan.outputs.type }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
          PUBLISH_WASM: ${{ needs.plan.outputs.publish_wasm }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_WASM_RESULT: ${{ needs.build-wasm.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PUBLISH_PLATFORMS_RESULT: ${{ needs.publish-platforms.result }}
          PUBLISH_WASM_RESULT: ${{ needs.publish-wasm.result }}
          PUBLISH_MAIN_RESULT: ${{ needs.publish-main.result }}
        run: |
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/dev/stdout}"

          {
            echo "Guchho npm publish"
            echo ""
            echo "Type: ${TYPE:-unknown}"

            if [[ "$PLAN_RESULT" != "success" ]]; then
              echo "Mode: FAILED"
              echo ""
              echo "The workflow failed before the platform set could be resolved."
              exit 0
            fi

            if [[ "$DRY_RUN" == "false" ]]; then
              MODE="PUBLISHED"
            else
              MODE="DRY RUN"
            fi
            echo "Mode: ${MODE}"
            echo ""

            # A package gets a tick only when every job that had to succeed
            # for it did: build + validate + its publish job.
            build_ok()  { [[ "$BUILD_RESULT" == "success" ]]; }
            wasm_build_ok() { [[ "$BUILD_WASM_RESULT" == "success" ]]; }
            val_ok()    { [[ "$VALIDATE_RESULT" == "success" ]]; }
            plat_ok()   { [[ "$PUBLISH_PLATFORMS_RESULT" == "success" ]]; }
            wasm_ok()   { [[ "$PUBLISH_WASM_RESULT" == "success" ]]; }
            main_ok()   { [[ "$PUBLISH_MAIN_RESULT" == "success" ]]; }

            echo "Packages:"

            failed=0
            for platform in ${PLATFORMS}; do
              if build_ok && val_ok && plat_ok; then
                echo "- ✓ @guchho/${platform}@${VERSION}"
              else
                echo "- ✗ @guchho/${platform}@${VERSION}"
                failed=1
              fi
            done

            if [[ "$PUBLISH_WASM" == "true" ]]; then
              if wasm_build_ok && val_ok && wasm_ok; then
                echo "- ✓ @guchho/wasm@${VERSION}"
              else
                echo "- ✗ @guchho/wasm@${VERSION}"
                failed=1
              fi
            fi

            if [[ "$TYPE" == "all" || "$TYPE" == "guchho" ]]; then
              # `all` publishes the main package only after the platform
              # set succeeds end-to-end; `guchho` publishes it standalone
              # (build and publish-platforms are skipped by design there).
              if [[ "$TYPE" == "all" ]]; then
                MAIN_DONE=""
                build_ok && val_ok && plat_ok && main_ok && MAIN_DONE="1"
              else
                MAIN_DONE=""
                val_ok && main_ok && MAIN_DONE="1"
              fi

              if [[ -n "$MAIN_DONE" ]]; then
                echo "- ✓ guchho@${VERSION}"
              else
                echo "- ✗ guchho@${VERSION}"
                failed=1
              fi
            fi

            echo ""

            if [[ "$failed" -ne 0 ]]; then
              if [[ "$DRY_RUN" == "false" ]]; then
                echo "**The workflow failed. Publishing stopped -- check the failing job's logs before re-running.**"
              else
                echo "**The workflow failed. No packages were published.**"
              fi
            elif [[ "$DRY_RUN" == "false" ]]; then
              echo "All selected packages were published to npm."
              echo ""
              echo "View on npm: https://www.npmjs.com/package/guchho"
            else
              echo "No packages were published."
            fi
          } | tee -a "$SUMMARY_FILE"
